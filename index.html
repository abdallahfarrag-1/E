<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التعرف على نوع الهاتف باستخدام Gemini</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 15px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .buttons-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-action {
            flex: 1;
            background-color: #34a853;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-action.gallery {
            background-color: #fbbc05;
            color: #202124;
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-submit {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #1557b0; }
        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #e8f0fe;
            color: #1967d2;
            font-weight: bold;
            display: none;
            text-align: right;
            white-space: pre-line;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 كاشف نوع الهاتف</h2>
    
    <label for="apiKey">أدخل مفتاح Gemini API:</label>
    <input type="text" id="apiKey" placeholder="ضع الـ API Key الخاص بك هنا">

    <label>اختر طريقة إدخال الصورة:</label>
    <div class="buttons-group">
        <button class="btn-action" onclick="document.getElementById('cameraInput').click()">📸 التقاط صورة</button>
        <button class="btn-action gallery" onclick="document.getElementById('galleryInput').click()">📁 معرض الصور</button>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">
    
    <img id="preview" alt="معاينة الصورة">

    <button class="btn-submit" onclick="analyzePhone()">التعرف على الهاتف</button>

    <div id="result"></div>
</div>

<script>
    let selectedFile = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('cameraInput').addEventListener('change', handleFileSelect);
    document.getElementById('galleryInput').addEventListener('change', handleFileSelect);

    // دالة لضغط الصورة وتصغير أبعادها باستخدام عنصر Canvas قبل إرسالها
    function compressImage(file, maxWidth = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;

                    // حساب الأبعاد الجديدة مع الحفاظ على نسبة الطول إلى العرض
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // تحويل الصورة إلى Base64 بصيغة JPEG وبدرجة ضغط محددة
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    const base64Data = compressedDataUrl.split(',')[1];
                    resolve(base64Data);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function analyzePhone() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert('يرجى إدخال API Key الخاص بك.');
            return;
        }

        if (!selectedFile) {
            alert('يرجى التقاط صورة أو اختيار صورة من المعرض أولاً.');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerText = 'جاري ضغط وتحليل الصورة والتعرف على الهاتف...';

        try {
            // ضغط الصورة برمجياً لتصبح أبعادها مثالية واستهلاكها قليل جداً للتوكنز
            const base64Image = await compressImage(selectedFile, 800, 0.8);

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

            const payload = {
                contents: [
                    {
                        parts: [
                            { text: 'تعرف على الهاتف الموجود في هذه الصورة. حدد الماركة (Brand) والموديل (Model) بدقة، واذكر أبرز مواصفاته إن أمكن باختصار باللغة العربية.' },
                            {
                                inline_data: {
                                    mime_type: 'image/jpeg',
                                    data: base64Image
                                }
                            }
                        ]
                    }
                ]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                resultDiv.innerText = 'حدث خطأ من API:\n' + JSON.stringify(data.error, null, 2);
            } else {
                resultDiv.innerText = 'لم يستطع النموذج معالجة الصورة، يرجى المحاولة مرة أخرى.';
            }

        } catch (error) {
            console.error(error);
            resultDiv.innerText = 'حدث خطأ أثناء الاتصال بالخادم:\n' + error.message;
        }
    }
</script>

</body>
</html>
