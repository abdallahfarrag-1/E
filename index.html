<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث باستخدام Google Lens API عبر SerpApi</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 15px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background-color: #1557b0; }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #e8f0fe;
            color: #1967d2;
            font-weight: bold;
            display: none;
            text-align: right;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 كاشف العناصر (SerpApi - Google Lens)</h2>
    
    <label for="apiKey">أدخل مفتاح SerpApi Key:</label>
    <input type="text" id="apiKey" placeholder="ضع الـ SerpApi Key هنا">

    <label for="imageUrl">رابط صورة الهاتف (Image URL):</label>
    <input type="text" id="imageUrl" placeholder="https://example.com/phone.jpg">

    <button onclick="searchWithSerpApi()">بحث عبر عدسة جوجل</button>

    <div id="result"></div>
</div>

<script>
    async function searchWithSerpApi() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const imageUrl = document.getElementById('imageUrl').value.trim();
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert('يرجى إدخال SerpApi Key الخاص بك.');
            return;
        }

        if (!imageUrl) {
            alert('يرجى إدخال رابط الصورة.');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerText = 'جاري البحث عبر Google Lens...';

        try {
            const url = `https://serpapi.com/search.json?engine=google_lens&url=${encodeURIComponent(imageUrl)}&api_key=${apiKey}`;

            const response = await fetch(url);
            const data = await response.json();

            if (data.visual_matches && data.visual_matches.length > 0) {
                let output = '📱 نتائج المطابقة البصرية (Google Lens):\n\n';
                data.visual_matches.slice(0, 5).forEach(item => {
                    output += `🔹 ${item.title || 'بدون عنوان'}\n`;
                    if (item.source) output += `   المصدر: ${item.source}\n`;
                    if (item.price) output += `   السعر: ${item.price.value} ${item.price.currency}\n`;
                    output += '\n';
                });
                resultDiv.innerText = output;
            } else {
                resultDiv.innerText = 'لم يتم العثور على نتائج متطابقة للصورة.';
            }

        } catch (error) {
            console.error(error);
            resultDiv.innerText = 'حدث خطأ أثناء الاتصال بالخدمة: ' + error.message;
        }
    }
</script>

</body>
</html>
