<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدسة جوجل - Google Vision API</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background-color: #1557b0; }
        #preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #e8f0fe;
            color: #1967d2;
            font-weight: bold;
            display: none;
            text-align: right;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 كاشف العناصر (عدسة جوجل)</h2>
    
    <label for="apiKey">أدخل مفتاح Google Cloud API Key:</label>
    <input type="text" id="apiKey" placeholder="ضع الـ API Key الخاص بك هنا">

    <label for="imageInput">اختر صورة أو التقط بالكاميرا:</label>
    <!-- أضفنا capture="environment" لتشغيل الكاميرا مباشرة في الموبايل -->
    <input type="file" id="imageInput" accept="image/*" capture="environment">
    
    <img id="preview" alt="معاينة الصورة">

    <button onclick="analyzeImage()">بحث وعدسة جوجل</button>

    <div id="result"></div>
</div>

<script>
    document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function analyzeImage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert('يرجى إدخال Google Cloud API Key.');
            return;
        }

        if (fileInput.files.length === 0) {
            alert('يرجى اختيار صورة أو تصوير صورة أولاً.');
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerText = 'جاري تحليل الصورة عبر Google Vision API...';

        try {
            const base64Image = await fileToBase64(fileInput.files[0]);

            const endpoint = `https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`;

            const requestBody = {
                requests: [
                    {
                        image: { content: base64Image },
                        features: [
                            { type: 'WEB_DETECTION', maxResults: 5 },
                            { type: 'OBJECT_LOCALIZATION', maxResults: 5 }
                        ]
                    }
                ]
            };

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.responses && data.responses[0]) {
                const res = data.responses[0];
                let output = '📊 نتائج المطابقة البصرية (عدسة جوجل):\n\n';

                if (res.webDetection && res.webDetection.webEntities && res.webDetection.webEntities.length > 0) {
                    output += '📱 العناصر المتطابقة على الويب:\n';
                    res.webDetection.webEntities.forEach(entity => {
                        if (entity.description) {
                            output += `• ${entity.description}\n`;
                        }
                    });
                }

                if (res.localizedObjectAnnotations && res.localizedObjectAnnotations.length > 0) {
                    output += '\n🏷️ العناصر المكتشفة في الصورة:\n';
                    res.localizedObjectAnnotations.forEach(obj => {
                        output += `• ${obj.name} (نسبة التأكد: ${Math.round(obj.score * 100)}%)\n`;
                    });
                }

                if (!res.webDetection?.webEntities?.length && !res.localizedObjectAnnotations?.length) {
                    output = 'لم يتم العثور على تفاصيل لهذه الصورة.';
                }

                resultDiv.innerText = output;
            } else {
                resultDiv.innerText = 'حدث خطأ في استجابة السيرفر.';
            }

        } catch (error) {
            console.error(error);
            resultDiv.innerText = 'حدث خطأ أثناء تحليل الصورة: ' + error.message;
        }
    }
</script>

</body>
</html>
